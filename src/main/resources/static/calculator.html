<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tester Calculator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <span>Tester Calculator</span>
    <span>
      <span id="current-user" data-testid="current-user"></span>
      <a href="/docs/" data-testid="docs-link">Docs</a>
      <button id="logout-button" type="button" class="link" data-testid="logout-button">Log out</button>
    </span>
  </header>

  <main class="layout" data-testid="calculator-page">
    <section class="card">
      <h2>Submit equation</h2>
      <form id="submit-form" data-testid="submit-form" novalidate>
        <label for="equation">Equation</label>
        <input id="equation" name="equation" type="text" placeholder="6+7+(3+4*5) * 3" data-testid="equation-input" required>
        <label for="priority">Priority</label>
        <select id="priority" name="priority" data-testid="priority-select">
          <option value="HIGH">High (1 s)</option>
          <option value="MEDIUM" selected>Medium (5 s)</option>
          <option value="LOW">Low (15 s)</option>
        </select>
        <button id="submit-button" type="submit" data-testid="submit-button">Submit</button>
      </form>
      <p id="submit-error" class="error" role="alert" data-testid="submit-error" hidden></p>
      <p id="submit-result" data-testid="submit-result" hidden>
        Operation id: <code id="submitted-id" data-testid="submitted-id"></code>
      </p>
    </section>

    <section class="card">
      <h2>Get result</h2>
      <form id="result-form" data-testid="result-form" novalidate>
        <label for="operation-id">Operation id</label>
        <input id="operation-id" name="operationId" type="text" data-testid="operation-id-input" required>
        <button id="get-result-button" type="submit" data-testid="get-result-button">Get result</button>
      </form>
      <p id="result-error" class="error" role="alert" data-testid="result-error" hidden></p>
      <div id="result-box" data-testid="result-box" hidden>
        <p>Status: <strong id="result-status" data-testid="result-status"></strong></p>
        <p id="result-line">Result: <strong id="result-value" data-testid="result-value"></strong></p>
      </div>
    </section>

    <section class="card wide">
      <div class="row">
        <h2>My operations</h2>
        <button id="refresh-button" type="button" data-testid="refresh-button">Refresh</button>
      </div>
      <table id="operations-table" data-testid="operations-table">
        <thead>
          <tr><th>Id</th><th>Equation</th><th>Priority</th><th>Status</th><th>Result</th><th></th></tr>
        </thead>
        <tbody id="operations-body"></tbody>
      </table>
      <p id="operations-empty" class="muted" data-testid="operations-empty" hidden>No operations yet.</p>
    </section>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
