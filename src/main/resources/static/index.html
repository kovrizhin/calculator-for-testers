<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tester Calculator – Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card" data-testid="login-page">
    <h1>Tester Calculator</h1>
    <p class="muted">Sign in with one of the training accounts. See the <a href="/docs/" data-testid="docs-link">specification</a>.</p>
    <form id="login-form" data-testid="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" data-testid="username-input" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password-input" required>
      <button id="login-button" type="submit" data-testid="login-button">Sign in</button>
    </form>
    <p id="login-error" class="error" role="alert" data-testid="login-error" hidden></p>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
